version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: edutrack-postgres
    environment:
      POSTGRES_DB: edutrack_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - edutrack-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edutrack-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/edutrack_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: edutrack-secret-key-for-jwt-token-generation-must-be-at-least-256-bits
      JWT_EXPIRATION: 86400000
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
    depends_on:
      - postgres
    networks:
      - edutrack-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: edutrack-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - edutrack-network

volumes:
  postgres_data:

networks:
  edutrack-network:
    driver: bridge
