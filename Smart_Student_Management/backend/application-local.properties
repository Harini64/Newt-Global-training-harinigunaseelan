package com.edutrack.service;

import com.edutrack.dto.AttendancePercentageResponse;
import com.edutrack.dto.AttendanceRequest;
import com.edutrack.dto.AttendanceResponse;
import org.springframework.data.domain.Page;
import org.springframework.data.domain.Pageable;

import java.time.LocalDate;
import java.util.List;

public interface AttendanceService {

    AttendanceResponse markAttendance(AttendanceRequest attendanceRequest, Long studentId);

    AttendanceResponse getAttendanceById(Long id);

    Page<AttendanceResponse> getAttendanceByStudentId(Long studentId, Pageable pageable);

    List<AttendanceResponse> getAttendanceByStudentIdAndDateRange(
            Long studentId, LocalDate startDate, LocalDate endDate);

    AttendancePercentageResponse getAttendancePercentage(Long studentId);

    AttendancePercentageResponse getAttendancePercentageByDateRange(
            Long studentId, LocalDate startDate, LocalDate endDate);

    List<AttendanceResponse> getAttendanceByStudentIdAndSubject(Long studentId, String subject);

    void deleteAttendance(Long id);
}
